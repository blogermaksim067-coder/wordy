/* ---------- demo / import / export ---------- */
function loadDemo(){
  const ms = platMetrics();
  if (!ms.length){ toast('Сначала добавь метрики'); return; }
  let subs = S.dash === 'tt' ? 800 : 120;
  for (let i = 44; i >= 0; i--){
    const d = addDays(today(), -i);
    const day = Object.assign({}, S.entries[d] || {});
    let filled = false;
    subs += Math.round(2 + Math.random() * 9 + (45 - i) * .12);
    const views = Math.round(60 + (45 - i) * 3 + Math.random() * 140);
    ms.forEach(m => {
      if (day[m.id] != null) return;
      filled = true;
      const n = m.name.toLowerCase();
      if (n.includes('подпис')) day[m.id] = subs;
      else if (n.includes('лайк')) day[m.id] = Math.round(views * (0.04 + Math.random() * .06));
      else if (n.includes('просмотр') && !n.includes('час')) day[m.id] = views * (S.dash === 'tt' ? 3 : 1);
      else if (n.includes('час') || n.includes('удерж')) day[m.id] = Math.round((S.dash === 'tt' ? 35 + Math.random() * 40 : views * (0.03 + Math.random() * .02)) * 10) / 10;
      else if (n.includes('ctr')) day[m.id] = Math.round((4 + Math.random() * 5) * 10) / 10;
      else day[m.id] = Math.round(20 + Math.random() * 80);
    });
    if (filled) S.entries[d] = day;
  }
  touch('entries'); render(); toast('Демо-данные для ' + platLabel() + ' загружены');
  setTimeout(checkMilestones, 400);
}
function exportData(){
  const payload = {app:'hq', v:1, exportedAt:new Date().toISOString(), config:cfgPayload(), days:S.entries};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hq-backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Копия скачана ✓');
}
async function importFile(file){
  try {
    const o = JSON.parse(await file.text());
    if (!o || !o.config || !Array.isArray(o.config.metrics) || !Array.isArray(o.config.widgets)) throw new Error('bad');
    confirmBox('Заменить текущие данные данными из файла? Это перезапишет метрики, панели и записи.', () => {
      applyConfig(o.config); S.entries = o.days && typeof o.days === 'object' ? o.days : {};
      applyTheme(); touch('config'); touch('entries'); render(); toast('Копия загружена ✓');
    }, 'Заменить');
  } catch(e){ toast('Это не похоже на файл копии'); }
}

/* ---------- events ---------- */
function move(id, dir){
  const list = platWidgets();
  const i = list.findIndex(w => w.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const a = S.widgets.findIndex(w => w.id === list[i].id);
  const b = S.widgets.findIndex(w => w.id === list[j].id);
  if (a < 0 || b < 0) return;
  [S.widgets[a], S.widgets[b]] = [S.widgets[b], S.widgets[a]];
  touch('config'); render();
}
function addTask(id){
  const inp = $(`[data-taskin="${id}"]`), w = widgetOf(id);
  if (!inp || !w) return;
  const text = inp.value.trim(); if (!text) return;
  (w.items = w.items || []).push({id: uid(), text, done:false});
  touch('config'); render();
  const n = $(`[data-taskin="${id}"]`); if (n) n.focus();
}
function numStep(id, dir){
  const w = widgetOf(id); if (!w) return;
  const step = Number(w.step) || 1;
  w.value = Math.round((Number(w.value || 0) + dir * step) * 1e6) / 1e6;
  touch('config'); render();
}

      const vid = getVideoCount();
      openModal({
        title: 'Изменить цель',
        html: `<div class="fld"><span>Тип</span>
          <div class="seg" id="g-type-seg">
            <button type="button" class="${g.type === 'videos' ? 'on' : ''}" data-act="seg" data-seg="g-type" data-arg="videos">🎬 Видео на канале</button>
            <button type="button" class="${g.type !== 'videos' ? 'on' : ''}" data-act="seg" data-seg="g-type" data-arg="custom">Своя цель</button>
          </div>
          <input type="hidden" id="g-type" value="${g.type === 'videos' ? 'videos' : 'custom'}">
        </div>
        <label class="fld"><span>Название</span><input class="in" id="g-title" value="${esc(g.title)}" maxlength="80"></label>
        <label class="fld"><span>Цель (число)</span><input class="in" type="number" id="g-target" min="1" step="1" value="${esc(g.target)}"></label>
        <p class="hint">Сейчас видео на канале: <b>${vid != null ? fmt(vid) : '—'}</b></p>`,
        onSave(){
          g.type = ($('#g-type').value === 'videos') ? 'videos' : 'custom';
          g.title = ($('#g-title').value || '').trim() || g.title;
          g.target = Math.max(1, Number($('#g-target').value) || 1);
          if (g.type === 'custom' && g.done && goalProgress(g).reached === false){ /* keep done flag */ }
          refreshVideoGoals();
          touch('config'); render(); toast('Цель сохранена ✓');
        }
      });
      break;
    }
    case 'goal-del': {
      const goals = ensureProfileGoals();
      const g = goals.find(x => x.id === id);
      if (!g) break;
      confirmBox('Удалить цель «' + g.title + '»?', () => {
        S.profile.goals = goals.filter(x => x.id !== id);
        touch('config'); render(); toast('Цель удалена');
      });
      break;
    }
    case 'goal-toggle': {
      const goals = ensureProfileGoals();
      const g = goals.find(x => x.id === id);
      if (!g || g.type === 'videos') break;
      g.done = !g.done;
      touch('config'); render();
      break;
    }
    case 'profile-edit': {
      const p = S.profile || {name:'', bio:'', successes:''};
      openModal({
        title:'Редактировать профиль',
        html: `<label class="fld"><span>Название</span><input class="in" id="pf-name" value="${esc(p.name || '')}" maxlength="40"></label>
          <label class="fld"><span>Описание</span><textarea class="in" id="pf-bio" rows="3" maxlength="300" style="resize:vertical;min-height:70px">${esc(p.bio || '')}</textarea></label>
          <p class="hint">Аватарку меняй нажатием на фото в профиле.</p>`,
        onSave(){
          S.profile = S.profile || {};
          S.profile.name = ($('#pf-name').value || '').trim() || 'Мой канал';
          S.profile.bio = ($('#pf-bio').value || '').trim();
          touch('config'); render(); toast('Профиль сохранён ✓');
        }
      });
      break;
    }
    case 'profile-photo': {
      const f = $('#pf-photo');
      if (f) f.click();
      break;
    }
    case 'profile-photo-clear': {
      S.profile = S.profile || {};
      S.profile.photo = '';
      touch('config'); render(); toast('Фото убрано');
      break;
    }
    case 'add-entry': openEntry(); break;
    case 'edit-entry': openEntry(arg); break;
    case 'del-entry': confirmBox('Удалить запись за ' + fmtDateFull(arg) + '?', () => { delete S.entries[arg]; touch('entries'); render(); }); break;
    case 'add-widget': openTypePicker(); break;
    case 'pick-type': closeModal(); openWidgetEditor(newWidget(arg), true); break;
    case 'w-left': move(id, -1); break;
    case 'w-right': move(id, 1); break;
    case 'w-size': { const w = widgetOf(id); if (w){ w.size = {1:2, 2:4, 4:1}[Number(w.size)] || 2; touch('config'); render(); } break; }
    case 'w-edit': { const w = widgetOf(id); if (w) openWidgetEditor(w, false); break; }
    case 'w-del': { const w = widgetOf(id); if (w) confirmBox('Удалить панель «' + (w.title || defaultTitle(w)) + '»?', () => { S.widgets = S.widgets.filter(x => x.id !== id); touch('config'); render(); }); break; }
    case 'w-comment': {
      const w = widgetOf(id); if (!w) break;
      openModal({
        title: w.comment ? 'Изменить комментарий' : 'Комментарий к панели',
        html: `<label class="fld"><span>Сообщение</span><input class="in" id="w-cmt" value="${esc(w.comment || '')}" maxlength="160" placeholder="Например: Здесь изменить"></label>
          <p class="hint">Покажется белым пузырьком сверху панели, как сообщение.</p>`,
        save: 'Сохранить',
        onSave(){
          w.comment = ($('#w-cmt').value || '').trim();
          touch('config'); render();
        }
      });
      break;
    }
    case 'w-comment-del': {
      const w = widgetOf(id); if (!w) break;
      w.comment = '';
      touch('config'); render();
      break;
    }
    case 'task-toggle': { const w = widgetOf(id), t = w && (w.items || []).find(x => x.id === el.dataset.t); if (t){ t.done = !t.done; touch('config'); render(); } break; }
    case 'task-del': { const w = widgetOf(id); if (w){ w.items = (w.items || []).filter(x => x.id !== el.dataset.t); touch('config'); render(); } break; }
    case 'task-clear': { const w = widgetOf(id); if (w){ w.items = (w.items || []).filter(x => !x.done); touch('config'); render(); } break; }
    case 'task-add': addTask(id); break;
    case 'num-inc': numStep(id, 1); break;
    case 'num-dec': numStep(id, -1); break;
    case 'add-metric': openMetric(null); break;
    case 'edit-metric': openMetric(metricOf(arg)); break;
    case 'del-metric': confirmBox('Удалить метрику «' + (metricOf(arg) || {}).name + '»? Записанные по ней значения тоже удалятся.', () => {
      S.metrics = S.metrics.filter(m => m.id !== arg);
      Object.keys(S.entries).forEach(d => { delete S.entries[d][arg]; if (!Object.keys(S.entries[d]).length) delete S.entries[d]; });
      S.widgets.forEach(w => { if (Array.isArray(w.metrics)) w.metrics = w.metrics.filter(x => x !== arg); });
      touch('config'); touch('entries'); render();
    }); break;
    case 'swatch': { const c = $('#m-color'); if (c) c.value = arg; break; }
    case 'seg': {
      const seg = el.dataset.seg;
      const hidden = $('#' + seg);
      if (hidden) hidden.value = arg;
      const parent = el.parentElement;
      if (parent) parent.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.arg === arg));
      break;
    }
    case 'pick-icon': {
      const forId = el.dataset.for || 'm-icon';
      const inp = $('#' + forId);
      const ciId = forId + '-ci';
      let ci = $('#' + ciId);
      document.querySelectorAll(`[data-icon-pick] button[data-for="${forId}"]`).forEach(b => b.classList.toggle('on', b.dataset.arg === arg));
      if (String(arg).startsWith('ci:')){
        if (!ci){ ci = document.createElement('input'); ci.type = 'hidden'; ci.id = ciId; $('#modal-root .dlg-b')?.appendChild(ci); }
        ci.value = arg;
        if (inp) inp.value = '';
      } else {
        if (ci) ci.remove();
        if (inp) inp.value = arg;
      }
      break;
    }
    case 'ci-upload': { const f = $('#ci-file'); if (f) f.click(); break; }
    case 'ci-del': {
      S.customIcons = (S.customIcons || []).filter(c => c.id !== id);
      touch('config'); render(); toast('Иконка удалена'); break;
    }
    case 'demo': loadDemo(); break;
    case 'export': exportData(); break;
    case 'import': { const f = $('#imp-file'); if (f) f.click(); break; }
    case 'pick-folder': pickDBFolder(); break;
    case 'reconnect-folder': reconnectDBFolder(); break;
    case 'sb-setup': openSupabaseSetup(); break;
    case 'sb-login': openAuthModal('login'); break;
    case 'sb-register': openAuthModal('register'); break;
    case 'sb-logout': sbLogout(); break;
    case 'sb-pull':
      if (!sbUser){ toast('Сначала войди'); break; }
      pullFromCloud().then(ok => { if (ok){ render(); setStatus('cloud'); } });
      break;
    case 'sb-push':
      if (!sbUser){ toast('Сначала войди'); break; }
      pushToCloud().then(ok => {
        if (ok){ sbDirty = false; toast('Сохранено в облако ✓'); setStatus('cloud'); }
      });
      break;
    case 'sb-account':
      openModal({
        title: 'Аккаунт Supabase',
        html: `<p><b>${esc(sbUser && sbUser.email || '')}</b></p>
          <p class="hint" style="margin-top:8px">Данные синхронизируются автоматически при изменениях. Лимит — обычный Postgres JSONB (десятки МБ), не 1 МБ как у Firestore.</p>`,
        save: 'Выйти',
        danger: true,
        onSave: () => { sbLogout(); }
      });
      break;
    case 'yt-sync': syncYouTube(); break;
    case 'clear-entries': confirmBox('Стереть ВСЕ записи аналитики? Метрики и панели останутся.', () => { S.entries = {}; touch('entries'); render(); toast('Записи стёрты'); }, 'Стереть'); break;
    case 'reset': confirmBox('Сбросить всё к начальному состоянию? Метрики, панели и записи будут потеряны.', () => { const t = S.theme; S = defaultState(); S.theme = t; activeScriptId = null; touch('config'); touch('entries'); render(); toast('Сброшено'); }, 'Сбросить'); break;
    case 'script-new': {
      const sc = {
        id: uid(),
        title: 'Новый сценарий',
        updated: today(),
        blocks: [
          {id: uid(), type: 'h1', text: ''},
          {id: uid(), type: 'p', text: ''}
        ]
      };
      ensureScripts().unshift(sc);
      activeScriptId = sc.id;
      touch('config'); render();
      const titleEl = document.querySelector('[data-script-title]');
      if (titleEl){ titleEl.focus(); titleEl.select(); }
      toast('Сценарий создан ✓');
      break;
    }
    case 'script-select': {
      activeScriptId = id;
      render();
      break;
    }
    case 'script-del': {
      const sc = scriptOf(id);
      if (!sc) break;
      confirmBox('Удалить сценарий «' + (sc.title || 'Без названия') + '»?', () => {
        S.scripts = (S.scripts || []).filter(x => x.id !== id);
        if (activeScriptId === id) activeScriptId = S.scripts[0] ? S.scripts[0].id : null;
        touch('config'); render(); toast('Сценарий удалён');
      });
      break;
    }
    case 'script-block-add': {
      const sc = scriptOf(id);
      if (!sc) break;
      const type = ['h1','h2','h3','p'].includes(arg) ? arg : 'p';
      (sc.blocks = sc.blocks || []).push({id: uid(), type, text: ''});
      sc.updated = today();
      touch('config'); render();
      requestAnimationFrame(() => {
        const areas = document.querySelectorAll('.script-block textarea');
        const last = areas[areas.length - 1];
        if (last){ last.focus(); autoResizeTA(last); }
      });
      break;
    }
    case 'script-block-del': {
      const sc = scriptOf(id);
      if (!sc) break;
      const bid = el.dataset.t;
      sc.blocks = (sc.blocks || []).filter(b => b.id !== bid);
      if (!sc.blocks.length) sc.blocks.push({id: uid(), type: 'p', text: ''});
      sc.updated = today();
      touch('config'); render();
      break;
    }
    case 'modal-close': closeModal(); break;
    case 'modal-save': if (modal){
      const r = modal.onSave($('#modal-root'));
      if (r && typeof r.then === 'function'){
        r.then(v => { if (v !== false) closeModal(); }).catch(() => {});
      } else if (r !== false) closeModal();
    } break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches && t.matches('[data-note]')){ const w = widgetOf(t.dataset.note); if (w){ w.text = t.value; touch('config'); } }
  if (t.matches && t.matches('[data-profile-success]')){
    S.profile = S.profile || {name:'Мой канал', bio:'', successes:''};
    S.profile.successes = t.value;
    touch('config');
  }
  if (t.matches && t.matches('[data-script-title]')){
    const sc = scriptOf(t.dataset.scriptTitle);
    if (sc){
      sc.title = t.value;
      sc.updated = today();
      touch('config');
      const side = document.querySelector(`.script-item[data-id="${sc.id}"] .si-title`);
      if (side) side.textContent = (t.value.trim() || 'Без названия');
    }
  }
  if (t.matches && t.matches('[data-script-block]')){
    const sc = scriptOf(t.dataset.scriptBlock);
    if (sc){
      const b = (sc.blocks || []).find(x => x.id === t.dataset.t);
      if (b){ b.text = t.value; sc.updated = today(); touch('config'); }
      autoResizeTA(t);
    }
  }
  if (t.id === 'm-icon' || (t.matches && t.matches('[data-icon-input]'))){
    const forId = t.id;
    const ci = $('#' + forId + '-ci'); if (ci) ci.remove();
    document.querySelectorAll(`[data-icon-pick] button[data-for="${forId}"]`).forEach(b => b.classList.remove('on'));
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches && t.matches('[data-act-change="script-block-type"]')){
    const sc = scriptOf(t.dataset.id);
    if (sc){
      const b = (sc.blocks || []).find(x => x.id === t.dataset.t);
      if (b && ['h1','h2','h3','p'].includes(t.value)){
        b.type = t.value;
        sc.updated = today();
        touch('config');
        const block = t.closest('.script-block');
        if (block) block.setAttribute('data-type', t.value);
        const ta = block && block.querySelector('textarea');
        if (ta) autoResizeTA(ta);
      }
    }
    return;
  }
  if (t.matches('[data-num]')){ const w = widgetOf(t.dataset.num); if (w){ const v = Number(t.value); w.value = isFinite(v) ? v : 0; touch('config'); } }
  else if (t.matches('[data-set="title"]')){ S.title = t.value.trim() || 'Wordy'; touch('config'); render(); }
  else if (t.matches('[data-set="theme"]')){ S.theme = t.value; applyTheme(); touch('config'); render(); }
  else if (t.matches('[data-set="yt-key"]')){ S.youtube = S.youtube || {}; S.youtube.apiKey = t.value; touch('config'); }
  else if (t.matches('[data-set="yt-channel"]')){ S.youtube = S.youtube || {}; S.youtube.channelId = t.value.trim(); touch('config'); }
  else if (t.id === 'imp-file' && t.files && t.files[0]){ importFile(t.files[0]); t.value = ''; }
  else if (t.id === 'ci-file' && t.files && t.files.length){
    const files = [...t.files].slice(0, 20);
    Promise.all(files.map(f => new Promise((res, rej) => {
      if (f.size > 200000){ toast('Файл слишком большой (макс ~200 КБ)'); res(null); return; }
      const r = new FileReader();
      r.onload = () => res({id: uid(), name: f.name.replace(/\.[^.]+$/, ''), data: r.result});
      r.onerror = rej;
      r.readAsDataURL(f);
    }))).then(list => {
      const ok = list.filter(Boolean);
      if (!ok.length) return;
      S.customIcons = (S.customIcons || []).concat(ok);
      touch('config'); render(); toast('Загружено: ' + ok.length);
    });
    t.value = '';
  }
  else if (t.id === 'pf-photo' && t.files && t.files[0]){
    const f = t.files[0];
    if (f.size > 5e6){ toast('Файл слишком большой (макс 5 МБ)'); t.value = ''; return; }
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 256;
        let w = img.width, h = img.height;
        if (w > max || h > max){
          const s = Math.min(max / w, max / h);
          w = Math.round(w * s); h = Math.round(h * s);
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        S.profile = S.profile || {};
        S.profile.photo = c.toDataURL('image/jpeg', 0.88);
        touch('config'); render(); toast('Аватарка сохранена ✓');
      };
      img.onerror = () => toast('Не удалось прочитать фото');
      img.src = r.result;
    };
    r.onerror = () => toast('Ошибка чтения файла');
    r.readAsDataURL(f);
    t.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal){ closeModal(); return; }
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.matches && t.matches('[data-taskin]')){ e.preventDefault(); addTask(t.dataset.taskin); }
  else if (t.id === 'idea-text'){ e.preventDefault(); document.querySelector('[data-act="idea-add"]')?.click(); }
  else if (modal && t.tagName === 'INPUT' && t.closest('.dlg') && t.type !== 'checkbox'){ e.preventDefault(); const r = modal.onSave($('#modal-root')); if (r !== false) closeModal(); }
});

/* chart hover */
document.addEventListener('pointermove', e => {
  const c = e.target.closest ? e.target.closest('.chart') : null;
  if (!c) return;
  const meta = chartMeta[c.dataset.chart]; if (!meta) return;
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * meta.W;
  let bi = 0, bd = Infinity;
  meta.xs.forEach((xx, i) => { const d = Math.abs(xx - x); if (d < bd){ bd = d; bi = i; } });
  const row = meta.rows[bi];
  const line = c.querySelector('.hl');
  line.setAttribute('x1', meta.xs[bi]); line.setAttribute('x2', meta.xs[bi]); line.style.opacity = 1;
  const tip = c.querySelector('.tip');
  tip.innerHTML = `<b>${fmtDateFull(row.d)}</b>` + row.items.map(it => `<div><i style="background:${it.color}"></i>${esc(it.name)}: ${fmt(it.v)}${it.unit ? ' ' + esc(it.unit) : ''}</div>`).join('');
  tip.hidden = false;
  tip.style.left = Math.min(84, Math.max(16, meta.xs[bi] / meta.W * 100)) + '%';
});
document.addEventListener('pointerout', e => {
  const c = e.target.closest ? e.target.closest('.chart') : null;
  if (!c || c.contains(e.relatedTarget)) return;
  const line = c.querySelector('.hl'); if (line) line.style.opacity = 0;
  const tip = c.querySelector('.tip'); if (tip) tip.hidden = true;
});

/* drag & drop: widgets (edit mode) + ideas between categories */
let dragId = null;
let dragIdeaId = null;
document.addEventListener('dragstart', e => {
  const idea = e.target.closest ? e.target.closest('.idea-card[data-idea]') : null;
  if (idea && !e.target.closest('button,input,textarea,select,a')){
    dragIdeaId = idea.dataset.idea;
    dragId = null;
    idea.classList.add('drag');
    if (e.dataTransfer){
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', 'idea:' + dragIdeaId); } catch(_){}
    }
    return;
  }
  const w = e.target.closest ? e.target.closest('.w') : null;
  if (!editing || !w) return;
  dragId = w.dataset.wid; dragIdeaId = null;
  w.classList.add('drag');
  if (e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch(_){} }
});
document.addEventListener('dragover', e => {
  if (dragIdeaId){
    const cat = e.target.closest ? e.target.closest('.idea-cat[data-cat]') : null;
    document.querySelectorAll('.idea-cat.drop-target').forEach(x => x.classList.remove('drop-target'));
    document.querySelectorAll('.idea-card.over').forEach(x => x.classList.remove('over'));
    if (cat && cat.dataset.cat !== '_orphan'){
      e.preventDefault();
      cat.classList.add('drop-target');
      // auto-expand collapsed target while dragging
      if (cat.classList.contains('collapsed')){
        const body = cat.querySelector('.idea-cat-body');
        if (body) body.style.display = 'block';
      }
    }
    return;
  }
  if (!dragId) return;
  const w = e.target.closest ? e.target.closest('.w') : null;
  document.querySelectorAll('.w.over').forEach(x => x.classList.remove('over'));
  if (w && w.dataset.wid !== dragId){ e.preventDefault(); w.classList.add('over'); }
});
document.addEventListener('drop', e => {
  if (dragIdeaId){
    const cat = e.target.closest ? e.target.closest('.idea-cat[data-cat]') : null;
    e.preventDefault();
    const catId = cat && cat.dataset.cat !== '_orphan' ? cat.dataset.cat : null;
    if (catId){
      const it = (S.ideas || []).find(x => x.id === dragIdeaId);
      if (it && it.cat !== catId){
        it.cat = catId;
        // ensure category is expanded so user sees the move
        const c = (S.ideaCategories || []).find(x => x.id === catId);
        if (c) c.collapsed = false;
        touch('config');
        toast('Идея перенесена → ' + (c ? c.name : catId));
      }
    }
    dragIdeaId = null;
    document.querySelectorAll('.idea-cat.drop-target,.idea-card.drag,.idea-card.over').forEach(x => x.classList.remove('drop-target', 'drag', 'over'));
    render();
    return;
  }
  if (!dragId) return;
  const w = e.target.closest ? e.target.closest('.w') : null;
  if (!w) return;
  e.preventDefault();
  const to = w.dataset.wid;
  if (to !== dragId){
    const from = S.widgets.findIndex(x => x.id === dragId), ti = S.widgets.findIndex(x => x.id === to);
    if (from >= 0 && ti >= 0){ const [it] = S.widgets.splice(from, 1); S.widgets.splice(ti, 0, it); touch('config'); }
  }
  dragId = null; render();
});
document.addEventListener('dragend', () => {
  dragId = null;
  dragIdeaId = null;
  document.querySelectorAll('.w.drag,.w.over,.idea-card.drag,.idea-card.over,.idea-cat.drop-target').forEach(x => x.classList.remove('drag', 'over', 'drop-target'));
});

/* ---------- boot ---------- */
S = defaultState();
document.body.classList.add('first-paint');
// LocalStorage is only a fast mirror. Supabase loads automatically after auth restore.
loadLocal();
mode = 'local';
setStatus('local');
applyTheme();
ensureAutoIcons();
render();
(function bootSupabase(){
  const cfg = loadSbConfig();
  if (cfg) initSupabaseFromConfig(cfg);
})();
setInterval(() => {
  const el = $('#clock');
  if (el) el.textContent = nowTime();
}, 1000);

// No local DB permission/reconnect flow on GitHub Pages.

})();
</script>
