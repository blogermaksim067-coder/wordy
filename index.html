<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7c5cff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080a11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Wordy</title>
<link rel="icon" href="Wordy.png" type="image/png">
<link rel="apple-touch-icon" href="Wordy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4fb; --surface:rgba(255,255,255,.82); --surface-solid:#ffffff; --border:rgba(24,28,70,.10); --border-hi:rgba(124,92,255,.45);
  --text:#14163a; --muted:#6b7092; --head:rgba(243,244,251,.78); --input:rgba(20,24,60,.05); --grid:rgba(20,24,60,.09);
  --accent:#7c5cff; --accent2:#19c3e6; --accent3:#ff5c93; --ok:#1fae67; --bad:#e5484d; --warn:#d98a00;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 14px 36px -22px rgba(40,40,100,.35);
  --blob1:rgba(124,92,255,.22); --blob2:rgba(25,195,230,.20); --blob3:rgba(255,92,147,.14);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080a11; --surface:rgba(255,255,255,.045); --surface-solid:#151928; --border:rgba(255,255,255,.09); --border-hi:rgba(154,130,255,.55);
    --text:#eef0ff; --muted:#8b91b4; --head:rgba(8,10,17,.72); --input:rgba(255,255,255,.06); --grid:rgba(255,255,255,.08);
    --ok:#3ddc97; --bad:#ff6b73; --warn:#ffb020;
    --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 24px 50px -26px rgba(0,0,0,.85);
    --blob1:rgba(124,92,255,.28); --blob2:rgba(25,195,230,.16); --blob3:rgba(255,92,147,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080a11; --surface:rgba(255,255,255,.045); --surface-solid:#151928; --border:rgba(255,255,255,.09); --border-hi:rgba(154,130,255,.55);
  --text:#eef0ff; --muted:#8b91b4; --head:rgba(8,10,17,.72); --input:rgba(255,255,255,.06); --grid:rgba(255,255,255,.08);
  --ok:#3ddc97; --bad:#ff6b73; --warn:#ffb020;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 24px 50px -26px rgba(0,0,0,.85);
  --blob1:rgba(124,92,255,.28); --blob2:rgba(25,195,230,.16); --blob3:rgba(255,92,147,.16);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 15px/1.5 'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(700px 500px at 8% -5%,var(--blob1),transparent 70%),radial-gradient(600px 460px at 100% 10%,var(--blob2),transparent 70%),radial-gradient(700px 500px at 50% 115%,var(--blob3),transparent 70%)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.disp{font-family:'Unbounded','Manrope',system-ui,sans-serif}
.muted{color:var(--muted)} .sm{font-size:12.5px} .center{text-align:center}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:var(--head);border-bottom:1px solid var(--border)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto;max-width:min(160px,28vw);margin-right:2px}
.logo{width:34px;height:34px;border-radius:11px;display:block;object-fit:cover;box-shadow:0 8px 22px -8px var(--accent);background:var(--input);flex-shrink:0}
.brand-name{font-family:'Unbounded','Manrope',sans-serif;font-weight:600;font-size:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;letter-spacing:.3px;min-width:5.5ch;text-align:center}
.nav{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--input);order:0;flex-shrink:0}
.nav button{border:0;background:transparent;padding:7px 13px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:7px;transition:color .22s ease,background .22s ease,transform .18s cubic-bezier(.34,1.2,.64,1),box-shadow .22s ease}
.nav button i,.nav button .ico{font-style:normal;opacity:.9;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex-shrink:0}
.nav button .ico img,.plat button .ico img{width:16px;height:16px;object-fit:contain;display:block;opacity:.85;transition:opacity .2s,transform .2s;filter:var(--ico-filter,none)}
.nav button .ico.ico-ava{width:22px;height:22px}
.nav button .ico.ico-ava img{width:22px;height:22px;border-radius:50%;object-fit:cover;filter:none!important;opacity:1;border:1.5px solid var(--border-hi);box-shadow:0 2px 8px -3px rgba(0,0,0,.35)}
.nav button.on .ico.ico-ava img{border-color:var(--accent)}
:root{--ico-filter:invert(1) brightness(.22)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ico-filter:none}}
:root[data-theme="dark"]{--ico-filter:none}
:root[data-theme="light"]{--ico-filter:invert(1) brightness(.22)}
.nav button:hover{color:var(--text);transform:translateY(-1px)}
.nav button:hover .ico img{opacity:1;transform:scale(1.1)}
.nav button.on{background:var(--surface-solid);color:var(--text);box-shadow:0 4px 14px -8px rgba(0,0,0,.5)}
.nav button.on .ico img{opacity:1}
.nav button:active{transform:scale(.96)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 11px;border-radius:99px;background:var(--input);white-space:nowrap;transition:background .2s,color .2s}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;transition:background .25s,box-shadow .25s}
.dot.db{background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.18)} .dot.local{background:var(--warn)} .dot.saving{background:var(--accent2);animation:pulse 1s ease-in-out infinite} .dot.err{background:var(--bad)}
.icon-btn{border:1px solid var(--border);background:var(--input);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;transition:transform .18s cubic-bezier(.34,1.2,.64,1),border-color .2s,background .2s,box-shadow .2s}
.icon-btn:hover{border-color:var(--border-hi);transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(0,0,0,.35)}
.icon-btn:active{transform:scale(.92)}
.streak-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:5px 12px 5px 8px;border-radius:99px;border:1px solid var(--border);background:var(--input);color:var(--muted);cursor:pointer;transition:transform .18s cubic-bezier(.34,1.2,.64,1),border-color .2s,background .2s,box-shadow .2s,color .2s;user-select:none;-webkit-user-select:none}
.streak-pill img{width:22px;height:22px;object-fit:contain;display:block;filter:none}
.streak-pill.lit{color:var(--text);border-color:color-mix(in srgb,var(--accent) 50%,var(--border));background:color-mix(in srgb,var(--accent) 16%,var(--input));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.streak-pill:hover{border-color:var(--border-hi);transform:translateY(-1px)}
.streak-pill:active{transform:scale(.94)}
.streak-pill .st-n{font-variant-numeric:tabular-nums;min-width:1.2ch}
@keyframes streakPop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.streak-pill.pop{animation:streakPop .45s cubic-bezier(.34,1.4,.64,1)}
/* ===== Mobile bottom nav ===== */
.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--head);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border);box-shadow:0 -8px 28px -18px rgba(0,0,0,.35)}
.bottom-nav-in{display:flex;gap:2px;max-width:560px;margin:0 auto}
.bottom-nav button{flex:1;border:0;background:transparent;padding:8px 4px 6px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
  font-weight:700;font-size:10.5px;letter-spacing:.1px;transition:color .2s,background .2s,transform .15s}
.bottom-nav button .ico{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.bottom-nav button .ico img{width:20px;height:20px;object-fit:contain;opacity:.9;filter:var(--ico-filter,none)}
.bottom-nav button .ico.ico-ava{width:24px;height:24px}
.bottom-nav button .ico.ico-ava img{width:24px;height:24px;border-radius:50%;object-fit:cover;filter:none!important;opacity:1;border:1.5px solid var(--border)}
.bottom-nav button.on{color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.bottom-nav button.on .ico img{opacity:1}
.bottom-nav button:active{transform:scale(.94)}
.bottom-nav .bn-lbl{line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:768px){
  .top-in{flex-wrap:nowrap;gap:8px;padding:8px 12px}
  .nav{display:none!important}
  .bottom-nav{display:block}
  .pill span.t{display:none}
  .brand{max-width:min(160px,42vw);margin-right:0}
  .brand-name{font-size:14px}
  .logo{width:30px;height:30px;border-radius:9px}
  .clock{font-size:12px;min-width:4.8ch}
  .top-r{gap:6px}
  .icon-btn{width:34px;height:34px}
  .streak-pill{padding:4px 10px 4px 6px;font-size:12px}
  .streak-pill span.st-lbl{display:none}
  .streak-pill img{width:20px;height:20px}
  .wrap{padding:14px 12px calc(88px + env(safe-area-inset-bottom,0px))}
  .bar{gap:10px;margin-bottom:14px;align-items:flex-start}
  .h1{font-size:clamp(18px,5.2vw,24px)}
  .sub{font-size:12.5px}
  .bar-r{width:100%;gap:6px}
  .bar-r .btn{padding:8px 12px;font-size:13px}
  .plat{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .plat::-webkit-scrollbar{display:none}
  .plat button{flex:1 0 auto;padding:8px 12px;font-size:12.5px}
  .banner{padding:14px 14px;gap:12px}
  .banner p{font-size:13px}
  .card{padding:14px;border-radius:18px}
  .dlg{border-radius:18px;max-height:min(92vh,100%)}
  .dlg-h{padding:14px 14px 8px}
  .dlg-b{padding:10px 14px 4px}
  .dlg-f{padding:10px 14px 14px}
  .btn{min-height:40px}
  .icon-btn,.round,.chk{min-width:40px;min-height:40px}
  .tasks li{padding:10px 12px;min-height:44px}
  .idea-card{padding:14px}
  .idea-actions .btn{min-height:36px}
  .mrow,.board-row{padding:12px;gap:10px}
  .profile-card{border-radius:20px}
  .scripts-side{max-height:220px}
  .script-title-in{padding:12px 14px 6px;font-size:clamp(16px,4.5vw,22px)}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px));font-size:13px}
}

@media(max-width:700px){
  .pill span.t{display:none}
  .brand{max-width:min(200px,55vw)}
  .streak-pill span.st-lbl{display:none}
}

@media(max-width:420px){
  .bottom-nav button{font-size:9.5px;padding:7px 2px 5px}
  .bottom-nav button .ico{width:20px;height:20px}
  .bottom-nav button .ico img{width:18px;height:18px}
  .top-r .clock{display:none}
  .bar-r .btn.primary{flex:1}
}

.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 90px}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.h1{font-family:'Unbounded','Manrope',sans-serif;font-weight:600;font-size:clamp(22px,4vw,30px);letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px;text-transform:capitalize}
.bar-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{border:1px solid var(--border);background:var(--input);padding:9px 15px;border-radius:12px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:transform .18s cubic-bezier(.34,1.2,.64,1),border-color .2s,background .2s,box-shadow .22s,filter .2s}
.btn:hover{border-color:var(--border-hi);transform:translateY(-1px);box-shadow:0 8px 20px -12px rgba(40,40,100,.35)}
.btn:active{transform:scale(.96) translateY(0)}
.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent3));box-shadow:0 10px 26px -12px var(--accent)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 14px 32px -12px var(--accent)}
.btn.danger{color:var(--bad);border-color:rgba(229,72,77,.35)}
.btn.danger:hover{background:rgba(229,72,77,.08)}
.btn.danger.solid{background:var(--bad);color:#fff;border:0}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.lnk{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;transition:opacity .2s,color .2s}
.lnk:hover{opacity:.8}

/* grid + widgets */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;grid-auto-flow:dense}
.w{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px 16px 14px;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;min-width:0;transition:border-color .25s ease,box-shadow .25s ease;overflow:hidden}
.w::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--c,var(--accent)),transparent 75%);opacity:.9;transition:opacity .25s}
.w:hover{border-color:var(--border-hi);box-shadow:0 18px 40px -24px rgba(40,40,100,.4)}
body.first-paint .w{animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
body.first-paint .w:nth-child(1){animation-delay:.02s}body.first-paint .w:nth-child(2){animation-delay:.05s}body.first-paint .w:nth-child(3){animation-delay:.08s}body.first-paint .w:nth-child(4){animation-delay:.11s}
body.first-paint .w:nth-child(5){animation-delay:.14s}body.first-paint .w:nth-child(6){animation-delay:.17s}body.first-paint .w:nth-child(7){animation-delay:.2s}body.first-paint .w:nth-child(8){animation-delay:.23s}
.w.s1{grid-column:span 1}.w.s2{grid-column:span 2}.w.s4{grid-column:span 4}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.w.s4{grid-column:span 2}}
@media(max-width:560px){.grid{gap:12px;grid-template-columns:1fr}.w.s1,.w.s2,.w.s4{grid-column:span 1}.w{padding:14px 13px 12px;border-radius:18px}}
@media(min-width:561px) and (max-width:768px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.w.s4{grid-column:span 2}}
.w-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:26px}
.w-t{font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.w-t i{font-style:normal;font-size:15px;filter:saturate(1.1)}
.w-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-b{flex:1;display:flex;flex-direction:column;min-height:0}
.editing .w{cursor:grab;border-style:dashed;border-color:var(--border-hi)}
.editing .w.drag{opacity:.4}.editing .w.over{transform:scale(.985);border-color:var(--accent2)}
.w-ctl{display:flex;gap:4px;flex-shrink:0}
.w-ctl button{border:1px solid var(--border);background:var(--input);min-width:26px;height:26px;border-radius:8px;font-size:12px;font-weight:800;padding:0 6px;line-height:1}
.w-ctl button:hover{border-color:var(--border-hi)} .w-ctl .del{color:var(--bad)}

/* stat */
.stat-val{font-family:'Unbounded','Manrope',sans-serif;font-weight:700;font-size:clamp(22px,3vw,32px);letter-spacing:-.5px;line-height:1.1;margin-top:2px;word-break:break-word}
.stat-val small{font-size:.42em;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.stat-val.dim{color:var(--muted)}
.stat-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.delta{font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px}
.delta.up{color:var(--ok);background:rgba(61,220,151,.13)} .delta.dn{color:var(--bad);background:rgba(255,107,115,.13)} .delta.flat{color:var(--muted);background:var(--input)}
.spark{width:100%;height:38px;margin-top:auto;padding-top:10px;display:block}
.stat-body{display:flex;flex-direction:column;flex:1}

/* chart */
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:'Manrope',sans-serif}
.chart .dotc{stroke:var(--surface-solid);stroke-width:2}
.chart .hl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:0;pointer-events:none}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--surface-solid);border:1px solid var(--border-hi);border-radius:12px;padding:8px 11px;font-size:12px;pointer-events:none;box-shadow:0 12px 30px -12px rgba(0,0,0,.6);z-index:3;white-space:nowrap}
.tip b{display:block;margin-bottom:3px;font-size:12px}
.tip div{display:flex;align-items:center;gap:6px;font-weight:600}
.tip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* goal — full panel */
.goal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;flex:1;min-height:0;padding:4px 0 2px;text-align:center}
.ring{width:min(100%,200px);aspect-ratio:1;max-width:220px;position:relative;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .trk{stroke:var(--grid)}
.ring .ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;padding:18%}
.ring .ring-pct{font-family:'Unbounded','Manrope',sans-serif;font-size:clamp(22px,4.5vw,32px);font-weight:700;line-height:1;letter-spacing:-.5px}
.ring .ring-nums{font-size:clamp(11px,2vw,13px);font-weight:700;color:var(--muted);line-height:1.25}
.ring .ring-nums b{color:var(--text);font-weight:800}
.goal-info{width:100%;text-align:center}
.goal-note{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.4}.goal-note.warn{color:var(--warn)}.goal-note b{color:var(--text)}
.win{color:var(--ok);font-weight:800;margin-top:2px;font-size:14px}

/* tasks / notes / number / table */
.tasks{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.tasks li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--input);font-weight:600;font-size:14px}
.tasks li span{flex:1;min-width:0;word-break:break-word}
.tasks li.done span{text-decoration:line-through;color:var(--muted)}
.tasks .x{border:0;background:none;color:var(--muted);opacity:.5;font-size:12px;padding:2px 4px}.tasks .x:hover{opacity:1;color:var(--bad)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0;padding:0}
.done .chk{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.t-add{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.notes{width:100%;flex:1;min-height:170px;resize:vertical;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:14px;padding:12px;font:500 14px/1.55 'Manrope',sans-serif;outline:none}
.notes:focus{border-color:var(--border-hi)}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:auto 0}
.cnt-mid{display:flex;flex-direction:column;align-items:center;min-width:0;flex:1}
.big-in{width:100%;text-align:center;border:0;background:transparent;color:var(--text);font-family:'Unbounded','Manrope',sans-serif;font-weight:700;font-size:clamp(22px,3vw,32px);outline:none;padding:0;-moz-appearance:textfield}
.big-in::-webkit-outer-spin-button,.big-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.round{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--input);font-size:18px;font-weight:800;flex-shrink:0;padding:0}
.round:hover{border-color:var(--border-hi)}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:420px}
.tbl th{text-align:right;color:var(--muted);font-weight:700;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--border);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl .act{text-align:right;width:1%}
.tbl .act button{border:0;background:none;padding:3px 7px;font-size:14px;opacity:.7}.tbl .act button:hover{opacity:1}
.empty-mini{color:var(--muted);font-size:13.5px;padding:22px 6px;text-align:center}

/* generic cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card + .card{margin-top:16px}
.card h2{font-family:'Unbounded','Manrope',sans-serif;font-weight:600;font-size:15px;margin-bottom:4px}
.card .desc{color:var(--muted);font-size:13px;margin-bottom:14px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 20px;border-radius:20px;margin-bottom:16px;border:1px solid var(--border-hi);background:linear-gradient(120deg,rgba(124,92,255,.16),rgba(255,92,147,.10))}
.banner b{font-family:'Unbounded','Manrope',sans-serif;font-weight:600;display:block;margin-bottom:3px}
.banner p{color:var(--muted);font-size:13.5px;max-width:560px}
.empty-big{text-align:center;padding:56px 20px;border:1.5px dashed var(--border);border-radius:24px;color:var(--muted)}
.empty-big .em{font-size:40px;margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--input);margin-top:8px;flex-wrap:wrap}
.mrow .dotc{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.mrow .nm{font-weight:700;flex:1;min-width:120px}
.mrow .meta{color:var(--muted);font-size:12.5px}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.set-grid{grid-template-columns:1fr}}

/* inputs */
.in{width:100%;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:12px;padding:10px 12px;font:600 14px 'Manrope',sans-serif;outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
select.in{appearance:none;-webkit-appearance:none;background-color:var(--input);color:var(--text);background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
select.in option,select.in optgroup{background:var(--surface-solid);color:var(--text)}
.fld{display:block;margin-bottom:12px}
.fld > span{display:flex;align-items:baseline;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld > span em{font-style:normal;opacity:.7}.fld > span small{margin-left:auto;font-weight:600;opacity:.7}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.hint{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer}.chip input{display:none}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid var(--border);background:var(--input);font-size:13px;font-weight:700;color:var(--muted)}
.chip input:checked + span{border-color:var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 18%,transparent)}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:26px;height:26px;border-radius:9px;border:2px solid transparent;padding:0}
.sw button:hover{border-color:var(--text)}
.sw input[type=color]{width:34px;height:30px;border:0;background:none;padding:0;cursor:pointer}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.types{grid-template-columns:1fr}}
.type{text-align:left;border:1px solid var(--border);background:var(--input);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.type:hover{border-color:var(--border-hi)}
.type i{font-style:normal;font-size:22px}.type b{font-size:14px}.type span{font-size:12.5px;color:var(--muted);font-weight:500}

/* platform switch + ideas */
.plat{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--input)}
.plat button{border:0;background:transparent;padding:7px 14px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;transition:color .22s,background .22s,transform .18s cubic-bezier(.34,1.2,.64,1),box-shadow .22s}
.plat button .ico{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}
.plat button .ico img{width:15px;height:15px;object-fit:contain;opacity:.8;transition:opacity .2s,transform .2s}
.plat button:hover{color:var(--text);transform:translateY(-1px)}
.plat button:hover .ico img{opacity:1;transform:scale(1.1)}
.plat button.on{background:var(--surface-solid);color:var(--text);box-shadow:0 4px 14px -8px rgba(0,0,0,.5)}
.plat button.on .ico img{opacity:1}
.plat button:active{transform:scale(.96)}
.idea-card{margin-top:14px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(12px);cursor:grab;transition:border-color .2s,box-shadow .2s,opacity .2s,transform .15s}
.idea-card:active{cursor:grabbing}
.idea-card.drag{opacity:.45}
.idea-card.over{border-color:var(--accent2);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent2) 35%,transparent)}
.idea-cat.drop-target .idea-cat-h{border-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 12%,var(--input))}
.idea-cat.drop-target .idea-cat-body{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.idea-card.done{opacity:.72}
.idea-card .ititle{font-weight:700;font-size:15px;word-break:break-word;line-height:1.4}
.idea-card .imeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.tag{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--input);border:1px solid var(--border);color:var(--muted)}
.tag.st-idea{color:var(--muted)}
.tag.st-shoot{color:var(--warn);border-color:rgba(217,138,0,.35)}
.tag.st-done{color:var(--ok);border-color:rgba(31,174,103,.35)}
.tag.hit{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.idea-card.done .ititle{text-decoration:line-through;color:var(--muted)}
.idea-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.idea-add .in{flex:1;min-width:140px}
.idea-panels{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.idea-panel{padding:10px 12px;border-radius:14px;background:var(--input);border:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.idea-panel .ip-type{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;padding-top:2px}
.idea-panel .ip-text{flex:1;font-weight:600;font-size:13.5px;word-break:break-word}
.idea-panel .ip-del{border:0;background:none;color:var(--muted);opacity:.5;cursor:pointer;padding:2px 4px}
.idea-panel .ip-del:hover{opacity:1;color:var(--bad)}
.hit-bar{height:6px;border-radius:99px;background:var(--grid);margin-top:10px;overflow:hidden}
.hit-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .3s}
.idea-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.idea-cat{margin-top:18px}
.idea-cat-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;padding:6px 8px;border-radius:12px;background:var(--input);border:1px solid var(--border);cursor:default;user-select:none}
.idea-cat-h .cat-toggle{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;cursor:pointer;flex-shrink:0;transition:color .15s,background .15s,transform .15s}
.idea-cat-h .cat-toggle:hover{color:var(--text);background:var(--surface-solid)}
.idea-cat.collapsed .cat-toggle{transform:rotate(-90deg)}
.idea-cat-h .cat-name{font-family:'Unbounded','Manrope',sans-serif;font-weight:600;font-size:15px;letter-spacing:-.2px;cursor:pointer}
.idea-cat-h .cat-cnt{font-size:12px;font-weight:700;color:var(--muted);padding:2px 9px;border-radius:99px;background:var(--surface-solid);border:1px solid var(--border)}
.idea-cat-h .cat-acts{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.idea-cat-body{margin-top:6px;min-height:48px;border-radius:14px;border:1.5px dashed transparent;padding:2px 0 6px;transition:border-color .2s,background .2s}
.idea-cat.collapsed .idea-cat-body{display:none}
.idea-cat-empty{color:var(--muted);font-size:13px;padding:12px 8px;border:1.5px dashed var(--border);border-radius:14px;text-align:center;margin-top:6px}
.idea-card{margin-top:10px}
.idea-cats-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.idea-cats-bar .muted{font-size:12.5px;font-weight:700}



/* profile */
.profile-card{max-width:480px;margin:0 auto;border-radius:24px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(14px);overflow:hidden}
.profile-cover{display:none}
.profile-body{padding:22px}
.profile-ava-wrap{position:relative;width:96px;height:96px;cursor:pointer}
.profile-ava{width:96px;height:96px;border-radius:50%;border:3px solid var(--border-hi);object-fit:cover;background:var(--input);display:block;box-shadow:0 10px 28px -10px rgba(0,0,0,.45)}
.profile-ava-wrap:hover .profile-ava{border-color:var(--accent)}
.profile-ava-badge{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface-solid);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.profile-name{font-family:'Unbounded','Manrope',sans-serif;font-weight:700;font-size:22px;margin-top:14px}
.profile-bio{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.5;white-space:pre-wrap}
.profile-edit-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.profile-success{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.profile-success h3{font-family:'Unbounded','Manrope',sans-serif;font-weight:600;font-size:14px;margin-bottom:8px}
.profile-success .notes{min-height:140px}
.profile-goals{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.profile-goals-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.profile-goals-h h3{font-family:'Unbounded','Manrope',sans-serif;font-weight:600;font-size:14px;margin:0}
.pg-card{padding:14px;border-radius:16px;background:var(--input);border:1px solid var(--border);margin-top:10px}
.pg-card.done{opacity:.72}
.pg-card.done .pg-title{text-decoration:line-through;color:var(--muted)}
.pg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pg-title{font-weight:700;font-size:14.5px;line-height:1.35;word-break:break-word}
.pg-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pg-bar{height:8px;border-radius:99px;background:var(--grid);margin-top:10px;overflow:hidden}
.pg-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .35s ease;min-width:0}
.pg-nums{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.pg-nums b{color:var(--text)}
.pg-acts{display:flex;gap:4px;flex-shrink:0}
.pg-empty{color:var(--muted);font-size:13px;padding:16px 8px;text-align:center;border:1.5px dashed var(--border);border-radius:14px;margin-top:8px}
.profile-stat .ps-hint{font-size:11px;font-weight:600;color:var(--muted);margin-top:2px;opacity:.85}
.profile-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.profile-stat{flex:1;min-width:120px;padding:12px 14px;border-radius:16px;background:var(--input);border:1px solid var(--border)}
.profile-stat .ps-val{font-family:'Unbounded','Manrope',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.3px}
.profile-stat .ps-lbl{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.fw-ov{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}
.fw-msg{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:101;pointer-events:none;text-align:center;padding:22px 28px;border-radius:22px;background:var(--surface-solid);border:1px solid var(--border-hi);box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:fwPop .5s cubic-bezier(.34,1.4,.64,1);max-width:90vw}
.fw-msg b{display:block;font-family:'Unbounded','Manrope',sans-serif;font-size:clamp(18px,4vw,26px);margin-bottom:6px}
.fw-msg span{color:var(--muted);font-weight:600;font-size:14px}
@keyframes fwPop{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.fw-particle{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none}

/* modal + toast */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,10,20,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dlg{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border-hi);border-radius:22px;box-shadow:var(--shadow),0 40px 80px -30px rgba(0,0,0,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:pop .18s ease-out;overflow:hidden}
.dlg.wide{max-width:640px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.85)}}
@keyframes softIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 10%,transparent),transparent);border-bottom:1px solid var(--border)}
.dlg-h h3{font-family:'Unbounded','Manrope',sans-serif;font-weight:600;font-size:16px}
.dlg-b{padding:12px 18px 6px;overflow:auto;background:transparent}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--border);background:color-mix(in srgb,var(--input) 60%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--surface);border:1px solid var(--border-hi);padding:10px 16px;border-radius:14px;font-weight:700;font-size:13.5px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);backdrop-filter:blur(12px);animation:pop .22s cubic-bezier(.34,1.2,.64,1);max-width:90vw}
body.first-paint .wrap > .bar,body.first-paint .wrap > .card,body.first-paint .wrap > .banner,body.first-paint .wrap > .empty-big,body.first-paint .wrap > .grid{animation:softIn .35s cubic-bezier(.22,1,.36,1) both}
.card{transition:border-color .2s,box-shadow .25s}
.card:hover{border-color:var(--border-hi)}
.round{transition:transform .15s ease,border-color .2s,background .2s}
.round:active{transform:scale(.92)}
.chk{transition:background .15s,border-color .15s,transform .12s}
.chk:active{transform:scale(.92)}
.mrow{transition:background .2s}
.icon-img{width:1.15em;height:1.15em;object-fit:contain;vertical-align:-.15em;display:inline-block;filter:none!important}
.icon-pick-wrap{margin-top:8px}
.icon-group-lbl{font-size:11.5px;font-weight:800;color:var(--muted);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.icon-pick{display:flex;flex-wrap:wrap;gap:8px;max-height:120px;overflow:auto}
.icon-pick button{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--input);padding:6px;display:grid;place-items:center;transition:border-color .15s,transform .15s,background .15s}
.icon-pick button:hover,.icon-pick button.on{border-color:var(--border-hi);background:var(--surface-solid)}
.icon-pick button img{width:22px;height:22px;object-fit:contain}
.icon-pick button span{font-size:18px;line-height:1}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--input);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);transition:color .2s,background .2s,transform .15s,box-shadow .2s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface-solid);color:var(--text);box-shadow:0 4px 14px -8px rgba(0,0,0,.45)}
.w-bubble{position:relative;align-self:flex-start;max-width:92%;margin:0 0 10px;padding:8px 12px 8px 12px;border-radius:14px 14px 14px 4px;background:#fff;color:#1a1a2e;font-size:12.5px;font-weight:600;line-height:1.35;box-shadow:0 6px 18px -8px rgba(0,0,0,.25);border:1px solid rgba(0,0,0,.06)}
:root[data-theme="dark"] .w-bubble,.w-bubble{/* always white message look */}
.w-bubble .bb-x{position:absolute;top:4px;right:6px;border:0;background:none;color:#999;font-size:11px;padding:2px 4px;opacity:0;transition:opacity .15s}
.w:hover .w-bubble .bb-x,.w-bubble:hover .bb-x{opacity:1}
.w-bubble .bb-x:hover{color:#e5484d}
.w-addc{position:absolute;top:10px;right:10px;z-index:2;width:28px;height:28px;border-radius:9px;border:1px solid var(--border);background:var(--surface-solid);color:var(--muted);font-size:16px;font-weight:800;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s,border-color .15s,color .15s;box-shadow:0 4px 12px -6px rgba(0,0,0,.3)}
.w:hover .w-addc,.w-addc.on{opacity:1;pointer-events:auto}
.w-addc:hover{border-color:var(--border-hi);color:var(--text);transform:scale(1.06)}
.editing .w-addc{display:none}
.board-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--input);margin-top:8px;flex-wrap:wrap}
.board-row .nm{font-weight:700;flex:1;min-width:100px}
.ci-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const safeColor = c => (/^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#7c5cff');
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const fmtDate = s => new Date(s + 'T00:00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
const fmtDateFull = s => new Date(s + 'T00:00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
function fmt(v){
  if (v == null || v === '' || !isFinite(Number(v))) return '—';
  v = Number(v);
  return v.toLocaleString('ru-RU', {maximumFractionDigits: Math.abs(v) >= 100 ? 0 : 2});
}
function short(v){
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (a >= 1e4) return (v / 1e3).toFixed(0) + 'K';
  if (a >= 1e3) return (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(Math.round(v * 10) / 10);
}
function stable(o){
  return JSON.stringify(o, (k, v) => (v && typeof v === 'object' && !Array.isArray(v))
    ? Object.keys(v).sort().reduce((a, key) => (a[key] = v[key], a), {}) : v);
}

/* ---------- constants ---------- */
const PALETTE = ['#ff5c93','#7c5cff','#19c3e6','#ffb020','#2fd67b','#ff7a45','#a78bfa','#f43f5e'];
const TYPES = {
  stat:   {name:'Показатель', ico:'🔢', desc:'Одна цифра из аналитики + динамика', size:1},
  chart:  {name:'График', ico:'📈', desc:'Линия или столбцы по одной или нескольким метрикам', size:2},
  goal:   {name:'Цель', ico:'🎯', desc:'Прогресс к цели, например «1000 подписчиков»', size:2},
  tasks:  {name:'Задачи', ico:'✅', desc:'Свой чек-лист дел', size:2},
  notes:  {name:'Заметки', ico:'📝', desc:'Свободный текст: идеи, планы', size:2},
  table:  {name:'Таблица', ico:'🗂', desc:'Последние записи аналитики', size:4},
  number: {name:'Счётчик', ico:'🧮', desc:'Твоя цифра с кнопками + и −', size:1}
};
const RANGES = [[7,'7 дней'],[30,'30 дней'],[90,'90 дней'],[365,'Год'],[0,'Всё время']];
const SIZES = [[1,'Маленькая (1 колонка)'],[2,'Средняя (2 колонки)'],[4,'Широкая (вся строка)']];
const SIZE_LBL = {1:'S', 2:'M', 4:'L'};
const LS_KEY = 'hq_workspace_v1';
const IDB_NAME = 'hq_fs_handles';
const IDB_STORE = 'handles';

/* ---------- state ---------- */
let S = null;
let view = 'dash';
let editing = false;
let mode = 'local';     // local | cloud (GitHub Pages: Supabase is the source of truth)
let statusKind = 'boot';
let dirHandle = null;   // FileSystemDirectoryHandle for DB folder
let pendingDirHandle = null; // handle known but permission not granted yet (needs user gesture)
let activeScriptId = null;
const chartMeta = {};
const lastSerial = {config:null, entries:null};

const timers = {};

/* ---------- Supabase cloud sync ---------- */
const SB_CFG_KEY = 'hq_supabase_cfg_v1';
let sbClient = null;       // supabase client
let sbUser = null;         // { id, email }
let sbReady = false;
let sbSyncing = false;
let sbLastCloudAt = 0;
let sbUnsubAuth = null;
let sbDirty = false; // local changes waiting for cloud sync

function loadSbConfig(){
  try {
    const r = localStorage.getItem(SB_CFG_KEY);
    if (!r) return null;
    const o = JSON.parse(r);
    if (!o || !o.url || !o.anonKey) return null;
    return o;
  } catch(e){ return null; }
}
function saveSbConfig(cfg){
  try {
    if (!cfg) localStorage.removeItem(SB_CFG_KEY);
    else localStorage.setItem(SB_CFG_KEY, JSON.stringify(cfg));
  } catch(e){}
}
function initSupabaseFromConfig(cfg){
  if (!cfg || !cfg.url || !cfg.anonKey) return false;
  if (typeof supabase === 'undefined' || !supabase.createClient){
    toast('Supabase SDK не загрузился — проверь интернет');
    return false;
  }
  try {
    sbClient = supabase.createClient(cfg.url.replace(/\/$/, ''), cfg.anonKey, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: localStorage
      }
    });
    sbReady = true;
    if (sbUnsubAuth) { try { sbUnsubAuth(); } catch(_){} }
    const { data: { subscription } } = sbClient.auth.onAuthStateChange((event, session) => {
      sbUser = session && session.user ? { id: session.user.id, email: session.user.email || '' } : null;
      // Do not await Supabase requests inside onAuthStateChange: Supabase
      // recommends keeping this callback synchronous to avoid auth-lock deadlocks.
      if (sbUser && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')){
        setStatus('saving');
        setTimeout(async () => {
          // Keep local edits made while the Supabase session was restoring.
          if (sbDirty) {
            const ok = await pushToCloud();
            if (ok) sbDirty = false;
            setStatus(ok ? 'cloud' : 'local');
          } else {
            const ok = await pullFromCloud();
            setStatus(ok ? 'cloud' : 'local');
          }
          render();
        }, 0);
      } else if (event === 'SIGNED_OUT'){
        sbUser = null;
        render();
      } else {
        render();
      }
    });
    sbUnsubAuth = () => subscription.unsubscribe();
    // Session restore is handled by the INITIAL_SESSION auth event above.
    // Do not start a second simultaneous cloud pull here.
    sbClient.auth.getSession().then(({ data }) => {
      const u = data && data.session && data.session.user;
      if (u) sbUser = { id: u.id, email: u.email || '' };
    }).catch(e => console.error('Supabase session restore:', e));
    return true;
  } catch(e){
    console.error(e);
    toast('Supabase: ' + (e && e.message ? e.message : 'ошибка инициализации'));
    sbReady = false;
    return false;
  }
}
function cloudPayload(){
  return {
    config: cfgPayload(),
    entries: JSON.parse(JSON.stringify(S.entries || {})),
    updated_at: new Date().toISOString()
  };
}
async function pushToCloud(){
  if (!sbReady || !sbUser || !sbClient) return false;
  sbSyncing = true;
  try {
    const payload = cloudPayload();
    const { error } = await sbClient.from('workspaces').upsert({
      user_id: sbUser.id,
      config: payload.config,
      entries: payload.entries,
      updated_at: payload.updated_at
    }, { onConflict: 'user_id' });
    sbSyncing = false;
    if (error) throw error;
    sbLastCloudAt = Date.now();
    return true;
  } catch(e){
    sbSyncing = false;
    console.error(e);
    toast('Облако: не удалось сохранить — ' + (e.message || e.hint || 'ошибка'));
    return false;
  }
}
async function pullFromCloud(){
  if (!sbReady || !sbUser || !sbClient) return false;
  try {
    const { data, error } = await sbClient.from('workspaces')
      .select('config, entries, updated_at')
      .eq('user_id', sbUser.id)
      .maybeSingle();
    if (error) throw error;
    if (!data){
      await pushToCloud();
      toast('Облако: создана первая копия данных ✓');
      return true;
    }
    if (data.config) applyConfig(data.config);
    if (data.entries && typeof data.entries === 'object') S.entries = data.entries;
    sbLastCloudAt = data.updated_at ? Date.parse(data.updated_at) : Date.now();
    saveLocal();
    applyTheme();
    toast('Данные загружены из облака ✓');
    return true;
  } catch(e){
    console.error(e);
    toast('Облако: не удалось загрузить — ' + (e.message || 'ошибка'));
    return false;
  }
}
async function sbRegister(email, pass){
  if (!sbClient) throw new Error('Supabase не настроен');
  const { data, error } = await sbClient.auth.signUp({ email, password: pass });
  if (error) throw error;
  return data.user;
}
async function sbLogin(email, pass){
  if (!sbClient) throw new Error('Supabase не настроен');
  const { data, error } = await sbClient.auth.signInWithPassword({ email, password: pass });
  if (error) throw error;
  return data.user;
}
async function sbLogout(){
  if (!sbClient) return;
  await sbClient.auth.signOut();
  sbUser = null;
  toast('Вышел из аккаунта');
  render();
}
function openAuthModal(modeAuth){
  const isReg = modeAuth === 'register';
  openModal({
    title: isReg ? 'Регистрация' : 'Вход в Wordy',
    html: '<p class="hint" style="margin-bottom:12px">Один аккаунт — данные на телефоне и на компьютере (Supabase).</p>' +
      '<label class="fld"><span>Email</span><input class="in" id="sb-email" type="email" autocomplete="email" placeholder="you@example.com"></label>' +
      '<label class="fld"><span>Пароль</span><input class="in" id="sb-pass" type="password" autocomplete="' + (isReg ? 'new-password' : 'current-password') + '" placeholder="минимум 6 символов"></label>' +
      (isReg ? '<p class="hint">Если в проекте включено подтверждение email — проверь почту после регистрации.</p>' : '<p class="hint">Нет аккаунта? Зарегистрируйся в Настройках → Supabase.</p>'),
    save: isReg ? 'Создать аккаунт' : 'Войти',
    onSave: async function(){
      const email = ($('#sb-email').value || '').trim();
      const pass = $('#sb-pass').value || '';
      if (!email || !pass){ toast('Введи email и пароль'); return false; }
      if (pass.length < 6){ toast('Пароль от 6 символов'); return false; }
      try {
        if (isReg){
          var user = await sbRegister(email, pass);
          // при включённом Confirm email сессии ещё нет — нужно письмо
          if (!sbUser){
            toast('Проверь почту: открой письмо от Supabase и подтверди email, затем войди');
          } else {
            toast('Аккаунт создан ✓');
          }
        } else {
          await sbLogin(email, pass);
          toast('Вход выполнен ✓');
        }
      } catch(e){
        const msg = (e && e.message) || 'Ошибка';
        const map = {
          'Invalid login credentials': 'Неверный email или пароль',
          'User already registered': 'Email уже зарегистрирован — войди',
          'Email not confirmed': 'Подтверди email по ссылке из письма'
        };
        toast(map[msg] || msg);
        return false;
      }
    }
  });
}
function openSupabaseSetup(){
  const cur = loadSbConfig() || {};
  openModal({
    title: 'Настройка Supabase',
    wide: true,
    html: '<p class="desc" style="margin-bottom:12px">Создай проект на <a href="https://supabase.com/dashboard" target="_blank" rel="noopener">supabase.com/dashboard</a>. Нужны URL и anon key + таблица <code>workspaces</code>.</p>' +
      '<label class="fld"><span>Project URL</span><input class="in" id="sb-url" value="' + esc(cur.url || '') + '" placeholder="https://xxxx.supabase.co"></label>' +
      '<label class="fld"><span>anon public key</span><input class="in" id="sb-anon" value="' + esc(cur.anonKey || '') + '" placeholder="eyJhbGciOi…"></label>' +
      '<p class="hint">Где взять: Project Settings → API → Project URL и <b>anon public</b>.</p>' +
      '<p class="hint" style="margin-top:10px">В SQL Editor выполни один раз:</p>' +
      '<code style="display:block;white-space:pre-wrap;margin-top:6px;font-size:11px;max-height:220px;overflow:auto">create table if not exists public.workspaces (\n  user_id uuid primary key references auth.users (id) on delete cascade,\n  config jsonb not null default \'{}\'::jsonb,\n  entries jsonb not null default \'{}\'::jsonb,\n  updated_at timestamptz not null default now()\n);\n\nalter table public.workspaces enable row level security;\n\ncreate policy "workspaces_own"\n  on public.workspaces for all\n  using (auth.uid() = user_id)\n  with check (auth.uid() = user_id);</code>',
    save: 'Сохранить и подключить',
    onSave: function(){
      const cfg = {
        url: ($('#sb-url').value || '').trim(),
        anonKey: ($('#sb-anon').value || '').trim()
      };
      if (!cfg.url || !cfg.anonKey){ toast('Нужны URL и anon key'); return false; }
      if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(cfg.url) && !cfg.url.startsWith('https://')){
        toast('URL должен начинаться с https://');
        return false;
      }
      saveSbConfig(cfg);
      if (sbClient){
        toast('Конфиг сохранён. Перезагрузи страницу для применения.');
        render();
        return;
      }
      if (initSupabaseFromConfig(cfg)){
        toast('Supabase подключён ✓ — зарегистрируйся или войди');
        render();
      } else return false;
    }
  });
}

/* ---------- IndexedDB for directory handle ---------- */
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key){
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch(e){ return null; }
}
async function idbSet(key, val){
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch(e){}
}
async function idbDel(key){
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch(e){}
}

/* ---------- File System Access API ---------- */
const hasFS = typeof window.showDirectoryPicker === 'function';

async function queryPermission(handle, write){
  try {
    const opts = { mode: write ? 'readwrite' : 'read' };
    return await handle.queryPermission(opts);
  } catch(e){ return 'denied'; }
}
async function requestPermission(handle, write){
  try {
    const opts = { mode: write ? 'readwrite' : 'read' };
    return await handle.requestPermission(opts);
  } catch(e){ return 'denied'; }
}
async function verifyPermission(handle, write){
  if ((await queryPermission(handle, write)) === 'granted') return true;
  if ((await requestPermission(handle, write)) === 'granted') return true;
  return false;
}

async function writeJsonFile(name, data){
  if (!dirHandle) throw new Error('no dir');
  const fileHandle = await dirHandle.getFileHandle(name, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
}

async function readJsonFile(name){
  if (!dirHandle) return null;
  try {
    const fileHandle = await dirHandle.getFileHandle(name);
    const file = await fileHandle.getFile();
    const text = await file.text();
    return JSON.parse(text);
  } catch(e){
    // file does not exist yet — ok
    return null;
  }
}

async function activateDirHandle(handle){
  dirHandle = handle;
  pendingDirHandle = null;
  mode = 'folder';
  // load from files (folder is source of truth when connected)
  const cfg = await readJsonFile('config.json');
  const ent = await readJsonFile('entries.json');
  if (cfg) applyConfig(cfg);
  if (ent){
    if (ent.days) S.entries = ent.days;
    else if (typeof ent === 'object') S.entries = ent;
  }
  saveLocal();
  setStatus('db');
  applyTheme();
  render();
  // keep files in sync with current in-memory state
  await flush('config');
  await flush('entries');
}

async function pickDBFolder(){
  if (!hasFS){
    toast('Твой браузер не поддерживает запись в папку. Используй Chrome или Edge.');
    return false;
  }
  try {
    const handle = await window.showDirectoryPicker({
      id: 'hq-db-folder',
      mode: 'readwrite',
      startIn: 'documents'
    });
    if (!(await verifyPermission(handle, true))){
      toast('Нужно разрешение на запись');
      return false;
    }
    await idbSet('dbDir', handle);
    try {
      const name = handle.name || 'DB';
      await idbSet('dbDirName', name);
    } catch(_){}
    await activateDirHandle(handle);
    toast('Папка DB подключена ✓');
    return true;
  } catch(e){
    if (e && e.name === 'AbortError') return false;
    toast('Не удалось открыть папку');
    return false;
  }
}

/** One-click reconnect: same folder, only permission prompt (user gesture required). */
async function reconnectDBFolder(){
  if (!hasFS) return false;
  const handle = pendingDirHandle || dirHandle || (await idbGet('dbDir'));
  if (!handle){
    return pickDBFolder();
  }
  try {
    // query first — may already be granted in this session
    if ((await queryPermission(handle, true)) === 'granted'){
      pendingDirHandle = null;
      await activateDirHandle(handle);
      toast('Папка DB подключена ✓');
      return true;
    }
    // requestPermission needs a user gesture (this click)
    const perm = await requestPermission(handle, true);
    if (perm === 'granted'){
      pendingDirHandle = null;
      await idbSet('dbDir', handle);
      await activateDirHandle(handle);
      toast('Доступ к папке DB восстановлен ✓');
      return true;
    }
    toast('Разрешение не выдано — нажми «Разрешить» в диалоге браузера');
    mode = 'reconnect';
    pendingDirHandle = handle;
    setStatus('reconnect');
    render();
    return false;
  } catch(e){
    toast('Не удалось восстановить доступ — выбери папку заново');
    return pickDBFolder();
  }
}

async function restoreDirHandle(){
  if (!hasFS) return false;
  try {
    const handle = await idbGet('dbDir');
    if (!handle) return false;
    // On page load requestPermission often fails without user gesture.
    // Only auto-activate if permission is already granted.
    const q = await queryPermission(handle, true);
    if (q === 'granted'){
      await activateDirHandle(handle);
      return true;
    }
    // Keep handle for one-click reconnect — do NOT delete from IDB
    pendingDirHandle = handle;
    mode = 'reconnect';
    setStatus('reconnect');
    return false;
  } catch(e){
    return false;
  }
}

/* ---------- save / load pipeline ---------- */
function touch(name){
  sbDirty = true;
  clearTimeout(timers[name]);
  setStatus('saving');
  timers[name] = setTimeout(() => flush(name), 400);
}

async function flush(name){
  const payload = name === 'config' ? cfgPayload() : {days: JSON.parse(JSON.stringify(S.entries))};
  const ser = stable(payload);
  saveLocal(); // always mirror to localStorage

  if (ser === lastSerial[name]){
    if (sbUser && sbReady) setStatus('cloud');
    else setStatus(sbUser && sbReady ? 'cloud' : 'local');
    return;
  }
  lastSerial[name] = ser;

  try {
    // No local DB writes on GitHub Pages. Supabase is the persistent store.
  } catch(err){
    lastSerial[name] = null;
    setStatus('err');
    toast('Не удалось записать файл — данные сохранены в браузере');
    console.error(err);
  }

  if (sbUser && sbReady){
    clearTimeout(timers._cloud);
    timers._cloud = setTimeout(async () => {
      const ok = await pushToCloud();
      if (ok) sbDirty = false;
      if (ok) setStatus('cloud');
      else setStatus('local');
    }, 600);
  } else {
    setStatus('local');
  }
}

async function initStorage(){
  // GitHub Pages mode: Supabase is the persistent source of truth.
  // Keep localStorage only as a fast/offline mirror; never ask the user to
  // choose a local DB folder.
  loadLocal();
  mode = (sbUser && sbReady) ? 'cloud' : 'local';
  setStatus(mode === 'cloud' ? 'cloud' : 'local');
  applyTheme();
  render();
}


/* ---------- data helpers ---------- */
const metricOf = id => S.metrics.find(m => m.id === id);
const widgetOf = id => S.widgets.find(w => w.id === id);

function series(mid, range){
  const from = range > 0 ? addDays(today(), -(range - 1)) : null;
  return Object.keys(S.entries).sort()
    .filter(d => !from || d >= from)
    .map(d => ({d, v: S.entries[d] ? S.entries[d][mid] : undefined}))
    .filter(p => p.v !== undefined && p.v !== null && p.v !== '' && isFinite(Number(p.v)))
    .map(p => ({d:p.d, v:Number(p.v)}));
}
function statFor(m, range){
  const all = series(m.id, 0);
  if (!all.length) return null;
  if (m.mode === 'daily'){
    const cur = range > 0 ? series(m.id, range) : all;
    if (!cur.length) return {value:0, delta:null, spark:[], label: range > 0 ? 'за ' + range + ' дн.' : 'за всё время'};
    const value = cur.reduce((a, p) => a + p.v, 0);
    let delta = null;
    if (range > 0){
      const from = addDays(today(), -(range - 1)), pf = addDays(today(), -(2 * range - 1));
      const prev = all.filter(p => p.d >= pf && p.d < from);
      if (prev.length) delta = value - prev.reduce((a, p) => a + p.v, 0);
    }
    return {value, delta, spark: cur.map(p => p.v), label: range > 0 ? 'за ' + range + ' дн.' : 'за всё время'};
  }
  const latest = all[all.length - 1];
  const cur = range > 0 ? series(m.id, range) : all;
  let delta = null;
  if (range > 0){
    const from = addDays(today(), -(range - 1));
    const before = all.filter(p => p.d < from);
    const base = before.length ? before[before.length - 1] : cur[0];
    if (base && base.d !== latest.d) delta = latest.v - base.v;
  } else if (all.length > 1){ delta = latest.v - all[0].v; }
  return {value: latest.v, delta, spark: cur.map(p => p.v), label: 'на ' + fmtDate(latest.d)};
}
function currentValue(m){
  const all = series(m.id, 0);
  if (!all.length) return null;
  return m.mode === 'daily' ? all.reduce((a, p) => a + p.v, 0) : all[all.length - 1].v;
}

const SUB_MILESTONES = [100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000];
const VIDEO_MILESTONES = [1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
function isSubMetric(m){
  if (!m) return false;
  const n = (m.name || '').toLowerCase();
  return n.includes('подпис') || n.includes('subscriber') || n.includes('subs');
}
function isVideoMetric(m){
  if (!m) return false;
  const n = (m.name || '').toLowerCase();
  return (n.includes('видео') || n.includes('video')) && !n.includes('час') && !n.includes('просмотр');
}
function subMetrics(){
  return (S.metrics || []).filter(m => isSubMetric(m) && m.mode !== 'daily');
}
function videoMetrics(){
  return (S.metrics || []).filter(m => isVideoMetric(m) && m.mode !== 'daily');
}
/** Текущее число видео на канале: метрика → lastVideoCount из YouTube API */
function getVideoCount(){
  const ms = videoMetrics();
  for (const m of ms){
    const v = currentValue(m);
    if (v != null && isFinite(v)) return Number(v);
  }
  const last = S.youtube && S.youtube.lastVideoCount;
  if (last != null && isFinite(last)) return Number(last);
  return null;
}
function ensureProfileGoals(){
  S.profile = S.profile || {name:'Мой канал', bio:'', successes:'', celebrated:[], photo:'', goals:[]};
  if (!Array.isArray(S.profile.goals)) S.profile.goals = [];
  return S.profile.goals;
}
function goalProgress(g){
  const target = Math.max(1, Number(g.target) || 1);
  let cur = 0;
  if (g.type === 'videos'){
    const v = getVideoCount();
    cur = v != null ? v : 0;
  } else {
    cur = g.done ? target : 0;
  }
  const pct = Math.max(0, Math.min(100, (cur / target) * 100));
  const reached = cur >= target;
  return {cur, target, pct, reached};
}
function refreshVideoGoals(){
  const goals = ensureProfileGoals();
  let changed = false;
  goals.forEach(g => {
    if (g.type !== 'videos') return;
    const {reached} = goalProgress(g);
    if (reached && !g.done){ g.done = true; changed = true; }
    // не снимаем done автоматически — цель остаётся выполненной
  });
  if (changed) touch('config');
  return changed;
}
function checkMilestones(){
  S.profile = S.profile || {name:'Мой канал', bio:'', successes:'', celebrated:[]};
  if (!Array.isArray(S.profile.celebrated)) S.profile.celebrated = [];
  const celeb = S.profile.celebrated;
  let best = null;
  subMetrics().forEach(m => {
    const v = currentValue(m);
    if (v == null) return;
    SUB_MILESTONES.forEach(ms => {
      if (v >= ms){
        const key = m.id + ':' + ms;
        if (!celeb.includes(key)){
          if (!best || ms > best.ms) best = {m, ms, key, v};
        }
      }
    });
  });
  if (best){
    celeb.push(best.key);
    // mark all lower for same metric as celebrated too so we don't spam
    SUB_MILESTONES.filter(ms => ms < best.ms).forEach(ms => {
      const k = best.m.id + ':' + ms;
      if (!celeb.includes(k)) celeb.push(k);
    });
    touch('config');
    launchFireworks(best.ms, best.m.name);
  }
}
function launchFireworks(n, metricName){
  const root = document.body;
  const ov = document.createElement('div');
  ov.className = 'fw-ov';
  ov.id = 'fw-ov';
  const colors = ['#ff5c93','#7c5cff','#19c3e6','#ffb020','#2fd67b','#ff7a45','#a78bfa','#f43f5e','#fff'];
  const W = window.innerWidth, H = window.innerHeight;
  for (let burst = 0; burst < 5; burst++){
    const cx = W * (0.2 + Math.random() * 0.6);
    const cy = H * (0.15 + Math.random() * 0.35);
    const count = 28 + Math.floor(Math.random() * 20);
    for (let i = 0; i < count; i++){
      const p = document.createElement('div');
      p.className = 'fw-particle';
      const ang = (Math.PI * 2 * i) / count + Math.random() * 0.2;
      const dist = 60 + Math.random() * 140;
      const col = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = col;
      p.style.boxShadow = '0 0 6px ' + col;
      const delay = burst * 180 + Math.random() * 100;
      p.animate([
        {transform:'translate(0,0) scale(1)', opacity:1},
        {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist + 40}px) scale(0)`, opacity:0}
      ], {duration: 900 + Math.random() * 500, delay, easing:'cubic-bezier(.15,.7,.3,1)', fill:'forwards'});
      ov.appendChild(p);
    }
  }
  const msg = document.createElement('div');
  msg.className = 'fw-msg';
  msg.innerHTML = `<b>🎉 Поздравляю с ${fmt(n)} подписчиков!</b><span>Продолжай в том же духе${metricName ? ' · ' + esc(metricName) : ''}</span>`;
  root.appendChild(ov);
  root.appendChild(msg);
  setTimeout(() => { ov.remove(); msg.remove(); }, 4200);
}

/* ---------- charts (own SVG) ---------- */
function smooth(pts){
  if (pts.length === 1) return `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++){
    const [x0, y0] = pts[i-1], [x1, y1] = pts[i], cx = (x0 + x1) / 2;
    d += ` C${cx.toFixed(1)} ${y0.toFixed(1)} ${cx.toFixed(1)} ${y1.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  return d;
}
function buildChart(w, ids){
  const ms = ids.map(metricOf);
  const range = w.range || 0;
  const data = ms.map(m => ({m, pts: series(m.id, range)}));
  const dates = [...new Set(data.flatMap(s => s.pts.map(p => p.d)))].sort();
  if (!dates.length) return null;
  const single = ms.length === 1, bars = w.kind === 'bar';
  const W = 640, H = 260, pl = single ? 46 : 14, pr = 14, pt = 14, pb = 28, pw = W - pl - pr, ph = H - pt - pb;
  const span = Math.max(1, daysBetween(dates[0], dates[dates.length - 1]));
  const xs = dates.map((d, i) => bars ? pl + pw * (i + .5) / dates.length
    : (dates.length === 1 ? pl + pw / 2 : pl + pw * daysBetween(dates[0], d) / span));
  const xOf = {}; dates.forEach((d, i) => xOf[d] = xs[i]);
  const scales = data.map(s => {
    const vs = s.pts.map(p => p.v);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    if (bars) lo = Math.min(0, lo);
    if (hi === lo) hi = lo + 1;
    const padv = (hi - lo) * .1;
    if (!bars){ lo -= padv; if (Math.min(...vs) >= 0 && lo < 0) lo = 0; }
    hi += padv;
    return {lo, hi, y: v => pt + ph * (1 - (v - lo) / (hi - lo))};
  });
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График">`;
  for (let i = 0; i <= 4; i++){
    const y = pt + ph * i / 4;
    out += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/>`;
    if (single){
      const v = scales[0].hi - (scales[0].hi - scales[0].lo) * i / 4;
      out += `<text class="ax" x="${pl - 8}" y="${y + 4}" text-anchor="end">${short(v)}</text>`;
    }
  }
  const n = dates.length, k = Math.min(5, n);
  for (let i = 0; i < k; i++){
    const idx = k === 1 ? 0 : Math.round(i * (n - 1) / (k - 1));
    const anchor = i === 0 && k > 1 ? 'start' : (i === k - 1 && k > 1 ? 'end' : 'middle');
    out += `<text class="ax" x="${xs[idx]}" y="${H - 8}" text-anchor="${anchor}">${fmtDate(dates[idx])}</text>`;
  }
  data.forEach((s, j) => {
    const color = safeColor(s.m.color), sc = scales[j];
    if (bars){
      const slot = pw / dates.length, group = slot * .72, bw = group / ms.length;
      const base = sc.y(Math.max(sc.lo, Math.min(0, sc.hi)));
      s.pts.forEach(p => {
        const i = dates.indexOf(p.d);
        const x = pl + slot * i + (slot - group) / 2 + j * bw;
        const y = sc.y(p.v), h = Math.max(2, Math.abs(base - y));
        out += `<rect x="${x.toFixed(1)}" y="${Math.min(y, base).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}" opacity=".92"/>`;
      });
    } else {
      const pts = s.pts.map(p => [xOf[p.d], sc.y(p.v)]);
      const path = smooth(pts);
      const gid = `g${w.id}${j}`;
      if (single){
        out += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".4"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
        out += `<path d="${path} L${pts[pts.length-1][0].toFixed(1)} ${pt + ph} L${pts[0][0].toFixed(1)} ${pt + ph} Z" fill="url(#${gid})"/>`;
      }
      out += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
      if (pts.length <= 45) pts.forEach(p => out += `<circle class="dotc" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="${color}"/>`);
    }
  });
  out += `<line class="hl" x1="0" x2="0" y1="${pt}" y2="${pt + ph}"/></svg>`;
  chartMeta[w.id] = {W, xs, rows: dates.map(d => ({d, items: data.map(s => {
    const p = s.pts.find(q => q.d === d);
    return p ? {name: s.m.name, color: safeColor(s.m.color), unit: s.m.unit, v: p.v} : null;
  }).filter(Boolean)}))};
  return out;
}
function spark(vals, color){
  if (vals.length < 2) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), rng = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * 100, 27 - ((v - mn) / rng) * 23]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const id = 'sp' + Math.random().toString(36).slice(2, 8);
  return `<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${path} L100 32 L0 32 Z" fill="url(#${id})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function bodyStat(w){
  const m = metricOf(w.metric); if (!m) return missing();
  const st = statFor(m, w.range || 0);
  if (!st) return `<div class="stat-body"><div class="stat-val dim">—</div><div class="stat-foot"><span class="muted sm">Пока нет данных</span></div></div>`;
  const d = st.delta;
  const dl = d == null ? '' : `<span class="delta ${d > 0 ? 'up' : d < 0 ? 'dn' : 'flat'}">${d > 0 ? '▲ +' : d < 0 ? '▼ ' : '± '}${fmt(d)}</span>`;

    <div class="stat-foot">${dl}<span class="muted sm">${esc(st.label)}</span></div>${spark(st.spark, safeColor(m.color))}</div>`;
}

  return `${legend}<div class="chart" data-chart="${w.id}">${svg}<div class="tip" hidden></div></div>`;

function bodyGoal(w){
  const m = metricOf(w.metric); if (!m) return missing();
  const cur = currentValue(m), target = Number(w.target) || 0;
  if (cur == null) return `<div class="empty-mini">Пока нет данных по «${esc(m.name)}»</div>`;
  const pct = target > 0 ? Math.max(0, Math.min(100, cur / target * 100)) : 0;
  const left = Math.max(0, target - cur), C = 2 * Math.PI * 52;
  let note = '';
  if (left <= 0) note = `<div class="win">🎉 Цель достигнута!</div>`;
  else {
    note = `<div class="goal-note">Осталось <b>${fmt(left)}${m.unit ? ' ' + esc(m.unit) : ''}</b></div>`;
    if (w.deadline){

      if (dl >= 0) note += `<div class="goal-note">До ${fmtDate(w.deadline)} — ${dl} дн. · нужно ≈ <b>${fmt(left / Math.max(dl, 1))}</b> в день</div>`;

        <circle cx="60" cy="60" r="52" fill="none" stroke="url(#${gid})" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(pct / 100 * C).toFixed(1)} ${C.toFixed(1)}"/>
      </svg>

      </div>
    </div>
    <div class="goal-info">${note}</div>
  </div>`;
}

/* ---------- views ---------- */
function nowTime(){
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function icoCandidates(file){
  if (!file) return [];
  const base = String(file).replace(/^icons\//i, '');
  const noExt = base.replace(/\.[a-z0-9]+$/i, '');
  const lower = base.toLowerCase();
  const variants = [
    'icons/' + base,
    'icons/' + lower,
    'icons/' + noExt + '.png',
    'icons/' + noExt.toLowerCase() + '.png',
    base,
    lower
  ];
  const map = {
    'dash.png': ['Dash.png','dash.png','Dashboard.png'],
    'youtube.png': ['YouTube.png','youtube.png','Youtube.png'],
    'tiktok.png': ['TikTok.png','tiktok.png','Tiktok.png'],
    'data.png': ['Data.png','data.png'],
    'ideas.png': ['Ideas.png','ideas.png'],
    'scenetext.png': ['SceneText.png','scenetext.png','Scripts.png'],
    'settings.png': ['Settings.png','settings.png'],
    'fire.png': ['Fire.png','fire.png'],
    'unfire.png': ['Unfire.png','unfire.png']
  };
  if (map[lower]) map[lower].forEach(n => variants.push('icons/' + n));
  // also try Capitalized first letter
  if (noExt) {
    const cap = noExt.charAt(0).toUpperCase() + noExt.slice(1).toLowerCase() + '.png';
    variants.push('icons/' + cap);
  }
  return [...new Set(variants)];

function ico(file, fallback, root){
  const fb = esc(fallback || '●');
  if (root) {
    return `<span class="ico ico-ava"><img src="${esc(file)}" alt="" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.hidden=false)"><span class="ico-fb" hidden>${fb}</span></span>`;
  }
  const cands = icoCandidates(file);
  const first = cands[0] || ('icons/' + file);
  const rest = cands.slice(1);
  let onerr;
  if (rest.length) {
    onerr = `onerror="(function(img){var L=img.getAttribute('data-alts');if(!L){img.style.display='none';var n=img.nextElementSibling;if(n)n.hidden=false;return;}var a=L.split('|');if(a.length){img.src=a.shift();if(a.length)img.setAttribute('data-alts',a.join('|'));else img.removeAttribute('data-alts');}else{img.style.display='none';var n=img.nextElementSibling;if(n)n.hidden=false;}})(this)" data-alts="${esc(rest.join('|'))}"`;
  } else {
    onerr = `onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.hidden=false)"`;
  }
  return `<span class="ico"><img src="${esc(first)}" alt="" ${onerr}><span class="ico-fb" hidden>${fb}</span></span>`;
}

const MODE_LBL = {total:'текущее значение', daily:'за день (суммируется)'};
async function syncYouTube(){
  S.youtube = S.youtube || {apiKey:'', channelId:'', lastSync:'', lastViewCount:null};
  const key = (S.youtube.apiKey || '').trim();
  const ch = (S.youtube.channelId || '').trim();
  if (!key){ toast('Вставь API Key в Настройках → YouTube API'); return; }
  if (!ch){ toast('Укажи Channel ID или @handle'); return; }
  toast('Запрос к YouTube…');
  try{
    let url;
    if (/^UC[\w-]{20,}$/.test(ch)){
      url = 'https://www.googleapis.com/youtube/v3/channels?part=statistics,snippet&id=' + encodeURIComponent(ch) + '&key=' + encodeURIComponent(key);
    } else {
      const handle = ch.replace(/^@/, '');
      url = 'https://www.googleapis.com/youtube/v3/channels?part=statistics,snippet&forHandle=' + encodeURIComponent(handle) + '&key=' + encodeURIComponent(key);
    }
    const res = await fetch(url);
    const data = await res.json();
    if (!res.ok || data.error){
      const msg = (data.error && data.error.message) || ('HTTP ' + res.status);
      toast('YouTube: ' + msg);
      return;
    }
    const item = data.items && data.items[0];
    if (!item){ toast('Канал не найден'); return; }
    const st = item.statistics || {};
    const subs = Number(st.subscriberCount);
    const views = Number(st.viewCount);
    const videos = Number(st.videoCount);
    const title = (item.snippet && item.snippet.title) || '';

    const day = today();
    if (!S.entries[day]) S.entries[day] = {};
    const ytMetrics = (S.metrics || []).filter(m => (m.plat || 'yt') === 'yt');
    const findM = (pred) => ytMetrics.find(pred);

    const mSubs = findM(m => /подпис|subscriber/i.test(m.name || ''));
    const mViews = findM(m => /просмотр/i.test(m.name || '') && !/час|удерж/i.test(m.name || ''));
    const mVideos = findM(m => /видео|video/i.test(m.name || ''));

    if (mSubs && isFinite(subs)) S.entries[day][mSubs.id] = subs;

    // Просмотры с API — всегда суммарные (как подписчики). Для mode=daily пишем дельту, если есть прошлый тотал.
    if (mViews && isFinite(views)){
      if (mViews.mode === 'daily'){
        const prev = S.youtube.lastViewCount;
        if (prev != null && isFinite(prev) && views >= prev){
          S.entries[day][mViews.id] = views - prev;
        } else {
          // первый синк: сохраняем полный тотал, чтобы не было нуля
          S.entries[day][mViews.id] = views;
        }
        S.youtube.lastViewCount = views;
      } else {
        S.entries[day][mViews.id] = views;
        S.youtube.lastViewCount = views;
      }
    } else if (isFinite(views)){
      S.youtube.lastViewCount = views;
    }

    if (mVideos && isFinite(videos)) S.entries[day][mVideos.id] = videos;
    // если метрики «Видео» ещё нет — создаём автоматически
    if (!mVideos && isFinite(videos)){
      const nm = {id: uid(), name:'Видео', icon:'🎬', unit:'', color:'#a78bfa', mode:'total', plat:'yt'};
      S.metrics.push(nm);
      S.entries[day][nm.id] = videos;
    }
    if (isFinite(videos)) S.youtube.lastVideoCount = videos;

    S.youtube.lastSync = new Date().toLocaleString('ru-RU');
    if (title && S.profile && (!S.profile.name || S.profile.name === 'Мой канал')){
      S.profile.name = title;
    }
    refreshVideoGoals();
    touch('config');
    touch('entries');
    render();
    const parts = [];
    if (isFinite(subs)) parts.push(fmt(subs) + ' подп.');
    if (isFinite(views)) parts.push(fmt(views) + ' просм.');
    if (isFinite(videos)) parts.push(fmt(videos) + ' вид.');
    toast('YouTube: ' + (parts.length ? parts.join(' · ') : 'ok') + (title ? ' · ' + title : ''));
    setTimeout(checkMilestones, 300);
  } catch (err){
    toast('Сеть/CORS: ' + (err && err.message ? err.message : 'ошибка'));
  }
}

  openModal({
